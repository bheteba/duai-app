name: Build Duai Clean

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Clean Flutter Project
        run: |
          rm -rf android ios linux macos windows web test
          rm -f pubspec.yaml pubspec.lock analysis_options.yaml README.md
          rm -rf lib

          flutter create \
            --platforms=android \
            --project-name=duai \
            --org=com.duai \
            .

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: duai-clean-apk
          path: build/app/outputs/flutter-apk/app-release.apk
