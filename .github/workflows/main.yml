// ============================================================
// ADD MEDICINE
// ============================================================

class AddMedicinePage extends StatefulWidget {
  const AddMedicinePage({super.key});

  @override
  State<AddMedicinePage> createState() => _AddMedicinePageState();
}

class _AddMedicinePageState extends State<AddMedicinePage> {
  final TextEditingController nameController =
      TextEditingController();

  final TextEditingController quantityController =
      TextEditingController();

  @override
  void dispose() {
    nameController.dispose();
    quantityController.dispose();
    super.dispose();
  }

  void continueToVerify() {
    if (nameController.text.trim().isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(
          content: Text('اكتب اسم الدواء أولاً'),
        ),
      );
      return;
    }

    Navigator.push(
      context,
      MaterialPageRoute(
        builder: (_) => VerifyPage(
          name: nameController.text.trim(),
          quantity: quantityController.text.trim().isEmpty
              ? 'غير محدد'
              : quantityController.text.trim(),
        ),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Directionality(
      textDirection: TextDirection.rtl,
      child: Scaffold(
        appBar: AppBar(
          title: const Text('إضافة دواء'),
        ),
        body: SingleChildScrollView(
          padding: const EdgeInsets.all(20),
          child: Column(
            crossAxisAlignment: CrossAxisAlignment.stretch,
            children: [
              Container(
                height: 150,
                decoration: BoxDecoration(
                  color: Colors.grey.shade100,
                  borderRadius: BorderRadius.circular(20),
                  border: Border.all(
                    color: Colors.grey.shade300,
                  ),
                ),
                child: Column(
                  mainAxisAlignment: MainAxisAlignment.center,
                  children: [
                    Icon(
                      Icons.camera_alt_outlined,
                      size: 45,
                      color: Colors.grey.shade600,
                    ),
                    const SizedBox(height: 8),
                    const Text(
                      'صورة الدواء',
                      style: TextStyle(
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 4),
                    const Text(
                      'يمكن إضافة الصورة لاحقاً',
                      style: TextStyle(
                        color: Colors.grey,
                        fontSize: 12,
                      ),
                    ),
                  ],
                ),
              ),

              const SizedBox(height: 22),

              TextField(
                controller: nameController,
                decoration: InputDecoration(
                  labelText: 'اسم الدواء',
                  hintText: 'مثال: بانادول',
                  border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(14),
                  ),
                ),
              ),

              const SizedBox(height: 15),

              TextField(
                controller: quantityController,
                keyboardType: TextInputType.number,
                decoration: InputDecoration(
                  labelText: 'الكمية',
                  hintText: 'مثال: 10 أقراص',
                  border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(14),
                  ),
                ),
              ),

              const SizedBox(height: 15),

              DropdownButtonFormField<String>(
                initialValue: 'أقراص',
                decoration: InputDecoration(
                  labelText: 'نوع الدواء',
                  border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(14),
                  ),
                ),
                items: const [
                  DropdownMenuItem(
                    value: 'أقراص',
                    child: Text('أقراص'),
                  ),
                  DropdownMenuItem(
                    value: 'شراب',
                    child: Text('شراب'),
                  ),
                  DropdownMenuItem(
                    value: 'كريم',
                    child: Text('كريم'),
                  ),
                  DropdownMenuItem(
                    value: 'حقن',
                    child: Text('حقن'),
                  ),
                ],
                onChanged: (_) {},
              ),

              const SizedBox(height: 25),

              SizedBox(
                height: 52,
                child: ElevatedButton(
                  onPressed: continueToVerify,
                  child: const Text(
                    'متابعة',
                    style: TextStyle(fontSize: 17),
                  ),
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }
}

