name: Build Duai Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        run: |
          mkdir -p /tmp/duai_source
          cp -a lib /tmp/duai_source/
          cp -a pubspec.yaml /tmp/duai_source/

          if [ -d assets ]; then
            cp -a assets /tmp/duai_source/
          fi

          flutter create --platforms=android --org com.duai --project-name app build_app

          cp -a /tmp/duai_source/lib build_app/
          cp /tmp/duai_source/pubspec.yaml build_app/

          if [ -d /tmp/duai_source/assets ]; then
            cp -a /tmp/duai_source/assets build_app/
          fi

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: duai-android-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
