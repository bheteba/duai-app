name: Extract Duai App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: find_zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Flutter project
        run: |
          ZIP="${{ steps.find_zip.outputs.zip }}"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          if [ -d "extracted/duai_flutter" ]; then
            cp -a extracted/duai_flutter/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f "$ZIP"

      - name: Save extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract Duai Flutter app"
            git push
          fi
